name: Original pinned Go emptyFile reference
on:
  pull_request:
permissions:
  contents: read
jobs:
  original-go-reference:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      DOTNET_CLI_TELEMETRY_OPTOUT: '1'
      TESTINGPLATFORM_TELEMETRY_OPTOUT: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v6
        with:
          go-version: '1.27.3'
          cache: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Fail-closed original Go event verifier regressions
        run: node --test tools/verify-original-go-case.test.ts
      - name: Execute complete original TestLocal/emptyFile.ts in the pinned Go reference
        run: ./scripts/verify-original-emptyfile-go.sh
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
      - name: Build product and pinned reference for bounded object differential
        shell: bash
        run: |
          set -euo pipefail
          dotnet restore Tscs.slnx --locked-mode --disable-parallel -m:1 -p:NuGetAudit=false
          dotnet build Tscs.slnx -c Release --no-restore -m:1 -p:UseSharedCompilation=false -p:NuGetAudit=false
          export GOPROXY=off GOSUMDB=off GOTOOLCHAIN=local GOWORK=off
          test "$(go env GOTELEMETRY)" = off
          reference="$GITHUB_WORKSPACE/.artifacts/object-reference"
          (cd .artifacts/original-empty-go/TypeScript/tsc; timeout 180s go build -o "$reference" ./cmd/tsc)
          node tools/verify-object-data-reference.ts "$reference" .artifacts/object-data-reference
          node tools/verify-array-iteration-reference.ts "$reference" .artifacts/array-iteration-reference
          node tools/verify-named-types-reference.ts "$reference" .artifacts/named-types-reference
          node tools/verify-literal-types-reference.ts "$reference" .artifacts/literal-types-reference
          node tools/verify-discriminant-reference.ts "$reference" .artifacts/discriminant-reference
          node tools/verify-guard-reference.ts "$reference" .artifacts/guard-reference
          node tools/verify-typeof-reference.ts "$reference" .artifacts/typeof-primitive-reference
          node tools/verify-conditional-reference.ts "$reference" .artifacts/conditional-values-reference
          node tools/verify-conditional-reference.ts "$reference" .artifacts/compound-guards-reference fixtures/compound-guards/semantic-cases.json
          node tools/verify-bitwise-reference.ts "$reference" .artifacts/numeric-bitwise-reference
           node tools/verify-division-reference.ts "$reference" .artifacts/numeric-division-reference
          node tools/verify-division-reference.ts "$reference" .artifacts/numeric-exponent-reference fixtures/numeric-exponent/semantic-cases.json
          node tools/verify-division-reference.ts "$reference" .artifacts/numeric-literals-reference fixtures/numeric-literals/semantic-cases.json
           node tools/verify-division-reference.ts "$reference" .artifacts/string-addition-reference fixtures/string-addition/semantic-cases.json
          node tools/verify-division-reference.ts "$reference" .artifacts/string-primitives-reference fixtures/string-primitives/semantic-cases.json
          node tools/verify-type-operators-reference.ts "$reference" .artifacts/type-operators-reference
          node tools/verify-switch-reference.ts "$reference" .artifacts/switch-reference
          node tools/verify-switch-reference.ts "$reference" .artifacts/switch-completion-reference fixtures/switch-completion/semantic-cases.json
          node tools/verify-switch-reference.ts "$reference" .artifacts/loop-control-reference fixtures/loop-control/semantic-cases.json
          node tools/verify-switch-reference.ts "$reference" .artifacts/classic-for-reference fixtures/classic-for/semantic-cases.json
          node tools/verify-switch-reference.ts "$reference" .artifacts/numeric-mutation-reference fixtures/numeric-mutation/semantic-cases.json
          node tools/verify-switch-reference.ts "$reference" .artifacts/throw-flow-reference fixtures/throw-flow/semantic-cases.json
          node tools/verify-switch-reference.ts "$reference" .artifacts/try-catch-reference fixtures/try-catch/semantic-cases.json
          node tools/verify-switch-reference.ts "$reference" .artifacts/void-return-reference fixtures/void-return/semantic-cases.json
          node tools/verify-switch-reference.ts "$reference" .artifacts/optional-parameters-reference fixtures/optional-parameters/semantic-cases.json
          node tools/verify-switch-reference.ts "$reference" .artifacts/default-parameters-reference fixtures/default-parameters/semantic-cases.json
          node tools/verify-switch-reference.ts "$reference" .artifacts/rest-parameters-reference fixtures/rest-parameters/semantic-cases.json
          node tools/verify-switch-reference.ts "$reference" .artifacts/spread-arguments-reference fixtures/spread-arguments/semantic-cases.json
          node tools/verify-switch-reference.ts "$reference" .artifacts/array-spreads-reference fixtures/array-spreads/semantic-cases.json
          node tools/verify-switch-reference.ts "$reference" .artifacts/object-spreads-reference fixtures/object-spreads/semantic-cases.json
          node tools/verify-switch-reference.ts "$reference" .artifacts/object-shorthand-reference fixtures/object-shorthand/semantic-cases.json
          node tools/verify-switch-reference.ts "$reference" .artifacts/object-index-reference fixtures/object-index/semantic-cases.json
          node tools/verify-switch-reference.ts "$reference" .artifacts/in-operator-reference fixtures/in-operator/semantic-cases.json
          node tools/verify-switch-reference.ts "$reference" .artifacts/for-in-reference fixtures/for-in/semantic-cases.json
          node tools/verify-switch-reference.ts "$reference" .artifacts/numeric-object-keys-reference fixtures/numeric-object-keys/semantic-cases.json
          node tools/verify-keyof-object-reference.ts "$reference" .artifacts/keyof-object-reference
          node tools/verify-indexed-access-reference.ts "$reference" .artifacts/indexed-access-reference
          node tools/verify-indexed-access-reference.ts "$reference" .artifacts/object-intersection-reference fixtures/object-intersection/semantic-cases.json
          node tools/verify-type-query-reference.ts "$reference" .artifacts/type-query-reference
          node tools/verify-type-query-reference.ts "$reference" .artifacts/function-types-reference fixtures/function-types/semantic-cases.json
          node tools/verify-typed-arrow-reference.ts "$reference" .artifacts/typed-arrow-reference
          node tools/verify-function-expression-reference.ts "$reference" .artifacts/function-expression-reference
          node tools/verify-function-expression-reference.ts "$reference" .artifacts/object-method-reference fixtures/object-method/semantic-cases.json
          node tools/verify-interface-inheritance-reference.ts "$reference" .artifacts/interface-inheritance-reference
      - name: Preserve bounded interface heritage raw reference evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pinned-interface-inheritance-reference-${{ github.sha }}
          path: .artifacts/interface-inheritance-reference/
          if-no-files-found: warn
          retention-days: 30
      - name: Preserve bounded object-method source and raw reference evidence
        if: always()
