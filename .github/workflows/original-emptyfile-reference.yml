name: Original pinned Go emptyFile reference
on:
  pull_request:
permissions:
  contents: read
jobs:
  original-go-reference:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      DOTNET_CLI_TELEMETRY_OPTOUT: '1'
      TESTINGPLATFORM_TELEMETRY_OPTOUT: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v6
        with:
          go-version: '1.27.3'
          cache: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Fail-closed original Go event verifier regressions
        run: node --test tools/verify-original-go-case.test.ts
      - name: Execute complete original TestLocal/emptyFile.ts in the pinned Go reference
        run: ./scripts/verify-original-emptyfile-go.sh
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
      - name: Build product and pinned reference for bounded object differential
        shell: bash
        run: |
          set -euo pipefail
          dotnet restore Tscs.slnx --locked-mode --disable-parallel -m:1 -p:NuGetAudit=false
          dotnet build Tscs.slnx -c Release --no-restore -m:1 -p:UseSharedCompilation=false -p:NuGetAudit=false
          export GOPROXY=off GOSUMDB=off GOTOOLCHAIN=local GOWORK=off
          test "$(go env GOTELEMETRY)" = off
          reference="$GITHUB_WORKSPACE/.artifacts/object-reference"
          (cd .artifacts/original-empty-go/TypeScript/tsc; timeout 180s go build -o "$reference" ./cmd/tsc)
          node tools/verify-object-data-reference.ts "$reference" .artifacts/object-data-reference
          node tools/verify-array-iteration-reference.ts "$reference" .artifacts/array-iteration-reference
          node tools/verify-named-types-reference.ts "$reference" .artifacts/named-types-reference
          node tools/verify-literal-types-reference.ts "$reference" .artifacts/literal-types-reference
          node tools/verify-discriminant-reference.ts "$reference" .artifacts/discriminant-reference
          node tools/verify-guard-reference.ts "$reference" .artifacts/guard-reference
          node tools/verify-typeof-reference.ts "$reference" .artifacts/typeof-primitive-reference
          node tools/verify-conditional-reference.ts "$reference" .artifacts/conditional-values-reference
          node tools/verify-conditional-reference.ts "$reference" .artifacts/compound-guards-reference fixtures/compound-guards/semantic-cases.json
          node tools/verify-bitwise-reference.ts "$reference" .artifacts/numeric-bitwise-reference
           node tools/verify-division-reference.ts "$reference" .artifacts/numeric-division-reference
          node tools/verify-division-reference.ts "$reference" .artifacts/numeric-exponent-reference fixtures/numeric-exponent/semantic-cases.json
          node tools/verify-division-reference.ts "$reference" .artifacts/numeric-literals-reference fixtures/numeric-literals/semantic-cases.json
           node tools/verify-division-reference.ts "$reference" .artifacts/string-addition-reference fixtures/string-addition/semantic-cases.json
          node tools/verify-division-reference.ts "$reference" .artifacts/string-primitives-reference fixtures/string-primitives/semantic-cases.json
          node tools/verify-type-operators-reference.ts "$reference" .artifacts/type-operators-reference
          node tools/verify-switch-reference.ts "$reference" .artifacts/switch-reference
          node tools/verify-switch-reference.ts "$reference" .artifacts/switch-completion-reference fixtures/switch-completion/semantic-cases.json
          node tools/verify-switch-reference.ts "$reference" .artifacts/loop-control-reference fixtures/loop-control/semantic-cases.json
          node tools/verify-switch-reference.ts "$reference" .artifacts/classic-for-reference fixtures/classic-for/semantic-cases.json
          node tools/verify-switch-reference.ts "$reference" .artifacts/numeric-mutation-reference fixtures/numeric-mutation/semantic-cases.json
          node tools/verify-switch-reference.ts "$reference" .artifacts/throw-flow-reference fixtures/throw-flow/semantic-cases.json
      - name: Preserve bounded throw-flow reference inputs and raw results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pinned-throw-flow-reference-${{ github.sha }}
          path: .artifacts/throw-flow-reference/
          retention-days: 30
          if-no-files-found: warn
      - name: Preserve type-operator reference inputs and raw results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pinned-type-operators-reference-${{ github.sha }}
          path: .artifacts/type-operators-reference/
          retention-days: 30
          if-no-files-found: warn
      - name: Preserve string primitive reference inputs and raw results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pinned-string-primitives-reference-${{ github.sha }}
          path: .artifacts/string-primitives-reference/
          retention-days: 30
          if-no-files-found: warn
      - name: Preserve string addition reference inputs and raw results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pinned-string-addition-reference-${{ github.sha }}
          path: .artifacts/string-addition-reference/
          retention-days: 30
          if-no-files-found: warn
      - name: Preserve numeric literal reference inputs and raw results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pinned-numeric-literals-reference-${{ github.sha }}
          path: .artifacts/numeric-literals-reference/
          retention-days: 30
          if-no-files-found: warn
      - name: Preserve numeric exponent reference inputs and raw results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pinned-numeric-exponent-reference-${{ github.sha }}
          path: .artifacts/numeric-exponent-reference/
          retention-days: 30
          if-no-files-found: warn
      - name: Preserve division/remainder reference inputs and raw results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pinned-numeric-division-reference-${{ github.sha }}
          path: .artifacts/numeric-division-reference/
          retention-days: 30
          if-no-files-found: warn
      - name: Preserve numeric bitwise reference inputs and raw results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pinned-numeric-bitwise-reference-${{ github.sha }}
          path: .artifacts/numeric-bitwise-reference/
          retention-days: 30
          if-no-files-found: warn
      - name: Preserve numeric mutation/do-while reference inputs and raw results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pinned-numeric-mutation-reference-${{ github.sha }}
          path: .artifacts/numeric-mutation-reference/
          retention-days: 30
          if-no-files-found: warn
      - name: Preserve classic for reference inputs and raw results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pinned-classic-for-reference-${{ github.sha }}
          path: .artifacts/classic-for-reference/
          retention-days: 30
          if-no-files-found: warn
      - name: Preserve while/continue reference inputs and raw results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pinned-loop-control-reference-${{ github.sha }}
          path: .artifacts/loop-control-reference/
          retention-days: 30
          if-no-files-found: warn
      - name: Preserve switch completion reference inputs and raw results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pinned-switch-completion-reference-${{ github.sha }}
          path: .artifacts/switch-completion-reference/
          retention-days: 30
          if-no-files-found: warn
      - name: Preserve switch-return reference inputs and raw results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pinned-switch-flow-reference-${{ github.sha }}
          path: .artifacts/switch-reference/
          retention-days: 30
          if-no-files-found: warn
      - name: Preserve compound guard reference inputs and raw results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pinned-compound-guards-reference-${{ github.sha }}
          path: .artifacts/compound-guards-reference/
          retention-days: 30
          if-no-files-found: warn
      - name: Preserve conditional expression reference inputs and raw results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pinned-conditional-value-reference-${{ github.sha }}
          path: .artifacts/conditional-values-reference/
          retention-days: 30
          if-no-files-found: warn
      - name: Preserve primitive typeof narrowing reference inputs and raw results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pinned-typeof-primitive-reference-${{ github.sha }}
          path: .artifacts/typeof-primitive-reference/
          retention-days: 30
          if-no-files-found: warn
      - name: Preserve returning-guard reference inputs and raw results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pinned-guard-flow-reference-${{ github.sha }}
          path: .artifacts/guard-reference/
          retention-days: 30
          if-no-files-found: warn
      - name: Preserve bounded discriminant-flow reference inputs and raw results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pinned-discriminant-flow-reference-${{ github.sha }}
          path: .artifacts/discriminant-reference/
          retention-days: 30
          if-no-files-found: warn
      - name: Preserve literal type differential inputs, outputs and raw results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pinned-literal-types-reference-${{ github.sha }}
          path: .artifacts/literal-types-reference/
          retention-days: 30
          if-no-files-found: warn
      - name: Preserve named types and union differential inputs, outputs and raw results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pinned-named-types-reference-${{ github.sha }}
          path: .artifacts/named-types-reference/
          retention-days: 30
          if-no-files-found: warn
      - name: Preserve array iteration differential inputs, outputs and raw results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pinned-array-iteration-reference-${{ github.sha }}
          path: .artifacts/array-iteration-reference/
          retention-days: 30
          if-no-files-found: warn
      - name: Preserve object differential inputs, outputs and raw results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pinned-object-data-reference-${{ github.sha }}
          path: .artifacts/object-data-reference/
          retention-days: 30
          if-no-files-found: warn
      - name: Preserve immutable source and raw reference evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pinned-original-emptyfile-go-${{ github.sha }}
          path: |
            .artifacts/original-empty-go/command.txt
            .artifacts/original-empty-go/upstream-ref.txt
            .artifacts/original-empty-go/upstream-sources.sha256
            .artifacts/original-empty-go/modules-verify.log
            .artifacts/original-empty-go/reference.jsonl
            .artifacts/original-empty-go/reference.stderr
            .artifacts/original-empty-go/exit-code.txt
            .artifacts/original-empty-go/reference-summary.json
          if-no-files-found: warn
          retention-days: 30
