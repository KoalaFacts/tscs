name: Compiler bootstrap
on: [push, pull_request]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: actions/setup-go@v6
        with:
          go-version: '1.27.3'
          cache: false
      - run: ./scripts/verify.sh
      - run: ./scripts/verify-upstream-lock-probe.sh
      - run: ./scripts/verify-upstream-full-discovery.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ts7-upstream-placeholder-discovery
          path: |
            .artifacts/upstream-full-discovery/archive.log
            .artifacts/upstream-full-discovery/runner.log
            .artifacts/upstream-full-discovery/mtp/
          if-no-files-found: warn
          retention-days: 30
